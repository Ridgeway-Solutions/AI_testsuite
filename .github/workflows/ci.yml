name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  install:
    # The installer is the first thing a new user runs, and nothing else in the
    # suite would notice if it broke. Run it for real on both platforms — macOS
    # ships a different sh and a Homebrew python layout.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: --check changes nothing
        run: |
          ./install.sh --check
          test ! -d .venv || (echo "--check created a venv"; exit 1)

      - name: install for real
        run: ./install.sh --dev

      - name: the installed environment works
        run: |
          .venv/bin/llmtest --version
          .venv/bin/llmtest plan suites/quick.yaml
          .venv/bin/llmtest run suites/quick.yaml --out runs/install --quiet
          .venv/bin/python -m pytest -q

      - name: re-running is safe
        run: ./install.sh

  install-powershell:
    # install.ps1 shipped twice without ever being executed, and the second
    # time it carried a real bug. PowerShell runs on Linux too, so this covers
    # the script on both — windows-latest is the one that actually matters.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: it parses
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1).Path, [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { $_.Message }; throw 'parse errors' }

      - name: -Check changes nothing
        shell: pwsh
        run: |
          ./install.ps1 -Check
          if (Test-Path .venv) { throw '-Check created a venv' }

      - name: install for real
        shell: pwsh
        run: ./install.ps1 -Dev

      - name: the installed environment works
        shell: pwsh
        run: |
          $py = if ($IsWindows) { '.venv/Scripts/python.exe' } else { '.venv/bin/python' }
          & $py -m llmtest --version
          if ($LASTEXITCODE -ne 0) { throw 'llmtest --version failed' }
          & $py -m llmtest plan suites/quick.yaml
          if ($LASTEXITCODE -ne 0) { throw 'plan failed' }
          & $py -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'pytest failed' }

      - name: re-running is safe
        shell: pwsh
        run: ./install.ps1

  install-windows-powershell:
    # The one PowerShell that actually matters and was never tested: 5.1 is
    # what `powershell -ExecutionPolicy Bypass -File .\install.ps1` starts,
    # which is what install.ps1's own header tells people to run. It passes
    # native-command arguments differently from pwsh 7 — a quoted -c payload
    # reached python with its quotes stripped — so an installer that only ever
    # ran under pwsh was never covered where its users run it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: it parses under Windows PowerShell
        shell: powershell
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1).Path, [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { $_.Message }; throw 'parse errors' }

      - name: it finds the runner's Python
        shell: powershell
        run: |
          $out = ./install.ps1 -Check | Out-String
          Write-Host $out
          if ($out -match 'no python interpreter found') { throw 'the probe missed a Python that is installed' }
          if ($out -match 'did not report a version') { throw 'the probe could not run an installed Python' }
          if (Test-Path .venv) { throw '-Check created a venv' }

      - name: install for real
        shell: powershell
        run: ./install.ps1 -Dev

      - name: the installed environment works
        shell: powershell
        run: |
          & .venv\Scripts\python.exe -m llmtest --version
          if ($LASTEXITCODE -ne 0) { throw 'llmtest --version failed' }
          & .venv\Scripts\python.exe -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'pytest failed' }

  self-scan:
    # Runs the suite end to end against the offline mock: no credentials, no
    # network, no spend. Catches breakage the unit tests would not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Full library against the keyword-guardrail mock
        run: llmtest run suites/full.yaml --out runs/naive --quiet

      - name: A permissive target must produce findings
        run: |
          llmtest run suites/full.yaml --profile vulnerable \
            --out runs/vulnerable --quiet --format json
          python -c "import json,sys; d=json.load(open('runs/vulnerable/report.json')); \
            sys.exit(0 if d['summary']['findings'] else 'expected findings on a permissive target')"

      - name: A hardened target must produce no findings, with full coverage
        run: |
          llmtest run suites/full.yaml \
            --profile strict --out runs/strict --quiet --fail-on low

      - name: An unreachable target must fail the gate, not pass it
        run: |
          if llmtest run --target-type http --url http://127.0.0.1:9/x \
               --attacks direct --out runs/unreachable --quiet --fail-on low; then
            echo "gate passed a run that tested nothing"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llmtest-reports
          path: runs/
